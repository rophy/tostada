{{- if and .Values.postgresql.enabled (not .Values.postgresql.external.host) }}
apiVersion: v1
kind: Secret
metadata:
  name: tostada-postgresql
  labels:
    app: tostada-postgresql
type: Opaque
data:
  password: {{ .Values.postgresql.password | default "tostada" | b64enc | quote }}
  dsn: {{ printf "host=tostada-postgresql dbname=%s user=%s password=%s sslmode=disable" (.Values.postgresql.database | default "tostada") (.Values.postgresql.username | default "tostada") (.Values.postgresql.password | default "tostada") | b64enc | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tostada-postgresql
spec:
  serviceName: tostada-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: tostada-postgresql
  template:
    metadata:
      labels:
        app: tostada-postgresql
      {{- with (include "tostada.podAnnotations" (dict "global" .Values.global)) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: postgresql
          image: {{ include "tostada.image" (dict "image" .Values.postgresql.image "global" .Values.global) }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | default "tostada" | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | default "tostada" | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tostada-postgresql
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | default "tostada" | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | default "tostada" | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgresql.storageClass }}
        storageClassName: {{ .Values.postgresql.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage | default "1Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: tostada-postgresql
spec:
  selector:
    app: tostada-postgresql
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
