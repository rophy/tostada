apiVersion: v1
kind: ServiceAccount
metadata:
  name: tostada
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tostada
rules:
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tostada
subjects:
  - kind: ServiceAccount
    name: tostada
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: tostada
  apiGroup: rbac.authorization.k8s.io
