apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-config
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8080;
        location /api/ {
            proxy_pass http://tostada:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location = /.well-known/openid-configuration {
            proxy_pass http://oidc-mock:8080;
            proxy_set_header Host $host;
        }
        location /authorize {
            proxy_pass http://oidc-mock:8080$request_uri;
            proxy_set_header Host $host;
        }
        location /token {
            proxy_pass http://oidc-mock:8080$request_uri;
            proxy_set_header Host $host;
        }
        location = /jwks {
            proxy_pass http://oidc-mock:8080;
            proxy_set_header Host $host;
        }
        location = /userinfo {
            proxy_pass http://oidc-mock:8080;
            proxy_set_header Host $host;
        }
        location /user/ {
            proxy_pass http://proxy-public:80;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
        location /hub/ {
            proxy_pass http://proxy-public:80;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
        location / {
            proxy_pass http://tostada:8080;
            proxy_set_header Host $host;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        hub.jupyter.org/network-access-hub: "true"
        hub.jupyter.org/network-access-proxy-http: "true"
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/gateway.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: config
          configMap:
            name: gateway-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
