{{- if .Values.oidcMock.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-mock-config
data:
  config.yaml: |
    issuer: {{ .Values.oidcMock.issuer | quote }}
    clients:
      - id: {{ .Values.oidc.clientID | quote }}
        secret: {{ .Values.oidc.clientSecret | quote }}
        redirect_uris:
          {{- range .Values.oidcMock.redirectURIs }}
          - {{ . | quote }}
          {{- end }}
    users:
      {{- toYaml .Values.oidcMock.users | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-mock
  template:
    metadata:
      labels:
        app: oidc-mock
      annotations:
        checksum/config: {{ toJson .Values.oidcMock | sha256sum }}
    spec:
      containers:
        - name: oidc-mock
          image: {{ include "tostada.image" (dict "image" .Values.oidcMock.image "global" .Values.global) }}
          command: ["/oidc-mock", "serve"]
          env:
            - name: OIDC_CONFIG_FILE
              value: "/config/config.yaml"
          ports:
            - containerPort: 8080
          {{- with .Values.oidcMock.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: oidc-mock-config
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-mock
spec:
  type: NodePort
  selector:
    app: oidc-mock
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: {{ .Values.oidcMock.nodePort }}
{{- end }}
