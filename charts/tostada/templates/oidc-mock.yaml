{{- if .Values.oidcMock.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-mock
  template:
    metadata:
      labels:
        app: oidc-mock
    spec:
      containers:
        - name: oidc-mock
          image: {{ .Values.oidcMock.image }}
          ports:
            - containerPort: 8080
          env:
            - name: OIDC_CONFIG
              value: |
                issuer: https://{{ .Values.domain }}
                clients:
                  - id: {{ .Values.oidc.clientID }}
                    secret: {{ .Values.oidc.clientSecret }}
                    redirect_uris:
                      - https://{{ .Values.domain }}/api/auth/callback
                users:
                  {{- toYaml .Values.oidcMock.users | nindent 18 }}
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-mock
spec:
  selector:
    app: oidc-mock
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
