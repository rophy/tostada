{{- $scheme := ternary "https" "http" (not (hasPrefix "localhost" .Values.domain)) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tostada-config
data:
  config.yaml: |
    server:
      addr: ":8080"
    oidc:
      issuerURL: {{ .Values.oidcMock.issuer | quote }}
      {{- if .Values.oidc.internalURL }}
      internalURL: {{ .Values.oidc.internalURL | quote }}
      {{- end }}
      clientID: {{ .Values.oidc.clientID | quote }}
      redirectURL: "{{ $scheme }}://{{ .Values.domain }}/api/auth/callback"
    jupyterhub:
      apiURL: "http://hub:8081/hub/api"
      proxyURL: "http://proxy-public:80"
    guacamole:
      url: {{ .Values.guacamole.url | quote }}
    database:
      path: {{ .Values.database.path | quote }}
    workspaces:
      {{- range $name, $ws := .Values.workspaces }}
      - name: {{ $name }}
        displayName: {{ $ws.displayName | quote }}
        description: {{ $ws.description | quote }}
        icon: {{ $ws.icon | quote }}
        type: {{ $ws.type | quote }}
        image: {{ include "tostada.image" (dict "image" $ws.image "global" $.Values.global) | quote }}
        port: {{ $ws.port }}
        {{- with $ws.cmd }}
        cmd:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $ws.rdpCredentials }}
        rdpCredentials:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $ws.spawnerOverrides }}
        spawnerOverrides:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
