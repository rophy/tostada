global:
  # imageRegistry: "corp-registry.example.com"

domain: localhost:30080

existingSecret: tostada-secrets

tostada:
  image:
    registry: ghcr.io
    repository: rophy/tostada
    tag: "0.1.0"
  imagePullPolicy: IfNotPresent
  persistence:
    size: 64Mi
    # storageClass: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

oidc:
  clientID: "tostada"
  clientSecret: "tostada-secret"
  internalURL: "http://oidc-mock:8080"

gateway:
  image:
    registry: ghcr.io
    repository: rophy/nginx
    tag: 1.31.3-1
  service:
    type: NodePort
    nodePort: 30080
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

guacamole:
  url: "http://guacamole:8080"
  guacd:
    image:
      registry: ghcr.io
      repository: rophy/guacd
      tag: 1.6.0-20260903-1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 256Mi
  web:
    image:
      registry: ""
      repository: guacamole/guacamole
      tag: "1.6.0"
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi

database:
  path: "/data/tostada.db"

oidcMock:
  enabled: true
  image:
    registry: ghcr.io
    repository: rophy/oidc-mock
    tag: 20260902-970dd92
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  nodePort: 30081
  issuer: "http://localhost:30081"
  redirectURIs:
    - "http://localhost:30080/api/auth/callback"
  users:
    - sub: alice
      email: alice@example.com
      name: Alice
      preferred_username: alice
    - sub: bob
      email: bob@example.com
      name: Bob
      preferred_username: bob

workspaces:
  jupyter:
    displayName: Jupyter Notebook
    description: Python data science environment
    icon: notebook
    type: jupyterhub
    image:
      registry: ""
      repository: jupyter/minimal-notebook
      tag: latest
    port: 8888
    cmd: ["jupyterhub-singleuser"]
    spawnerOverrides:
      default_url: "/lab"
  kasmvnc-ubuntu:
    displayName: Ubuntu Desktop (KasmVNC)
    description: Full Ubuntu desktop in browser
    icon: desktop
    type: jupyterhub
    servesFromRoot: true
    image:
      registry: ghcr.io
      repository: rophy/ubuntu-desktop
      tag: "20260903-1"
    port: 6901
    cmd: ["/dockerstartup/kasm_default_profile.sh"]
    spawnerOverrides:
      cmd: null
      environment:
        VNCOPTIONS: "-DisableBasicAuth -sslOnly=0"
  kasmvnc-remmina:
    displayName: Remmina Remote Desktop
    description: Remote desktop client for RDP, VNC, and SSH
    icon: desktop
    type: jupyterhub
    servesFromRoot: true
    image:
      registry: ""
      repository: kasmweb/remmina
      tag: "1.19.0"
    port: 6901
    cmd: ["/dockerstartup/kasm_default_profile.sh"]
    spawnerOverrides:
      cmd: null
      environment:
        VNCOPTIONS: "-DisableBasicAuth -sslOnly=0"
  kasmvnc-chrome:
    displayName: Chrome Browser
    description: Isolated Chrome browser with clipboard disabled
    icon: browser
    type: jupyterhub
    servesFromRoot: true
    image:
      registry: ""
      repository: kasmweb/chrome
      tag: "1.19.0"
    port: 6901
    cmd: ["/dockerstartup/kasm_default_profile.sh"]
    spawnerOverrides:
      cmd: null
      environment:
        VNCOPTIONS: "-DisableBasicAuth -sslOnly=0"
        KASM_SVC_SEND_CUT_TEXT: "-SendCutText=0"
        KASM_SVC_ACCEPT_CUT_TEXT: "-AcceptCutText=0"

# JupyterHub subchart uses name/tag (not registry/repository/tag).
# global.imageRegistry does not apply here. For air-gapped environments,
# override hub.image.name and proxy.chp.image.name with the full path,
# e.g. corp-registry.example.com/jupyterhub/k8s-hub
jupyterhub:
  hub:
    image:
      name: quay.io/jupyterhub/k8s-hub
      tag: "4.4.0"
    networkPolicy:
      enabled: false
    config:
      JupyterHub:
        allow_named_servers: true
      Authenticator:
        enable_auth_state: true
        admin_users:
          - admin
      KubeSpawner:
        http_timeout: 120
    extraConfig:
      prefixProxy: |
        from jupyterhub.proxy import ConfigurableHTTPProxy

        class PrefixAwareProxy(ConfigurableHTTPProxy):
            """Compensate for --no-include-prefix on a per-route basis."""

            def _serves_from_root(self, username, server_name):
                user = self.app.users.get(username)
                if not user:
                    return False
                spawner = user.spawners.get(server_name)
                if not spawner:
                    return False
                labels = getattr(spawner, "extra_labels", {}) or {}
                return labels.get("tostada.dev/serves-from-root") == "true"

            async def add_route(self, routespec, target, data):
                if data and "user" in data:
                    username = data["user"]
                    server_name = data.get("server_name", "")
                    if not self._serves_from_root(username, server_name):
                        target = target.rstrip("/") + routespec
                await super().add_route(routespec, target, data)

        c.JupyterHub.proxy_class = PrefixAwareProxy
      profileList: |
        import yaml

        with open("/etc/tostada/config.yaml") as f:
            cfg = yaml.safe_load(f)

        profile_list = []
        for ws in cfg.get("workspaces", []):
            profile = {
                "display_name": ws["displayName"],
                "kubespawner_override": {
                    "image": ws["image"],
                },
            }
            if ws.get("port"):
                profile["kubespawner_override"]["port"] = ws["port"]
            if ws.get("servesFromRoot"):
                profile["kubespawner_override"].setdefault("extra_labels", {})["tostada.dev/serves-from-root"] = "true"
            overrides = ws.get("spawnerOverrides") or {}
            for k, v in overrides.items():
                profile["kubespawner_override"][k] = v
            profile_list.append(profile)

        c.KubeSpawner.profile_list = profile_list
    existingSecret: tostada-secrets
    extraVolumes:
      - name: tostada-config
        configMap:
          name: tostada-config
    extraVolumeMounts:
      - name: tostada-config
        mountPath: /etc/tostada
    services:
      tostada: {}
    loadRoles:
      tostada-service:
        scopes:
          - "admin:users"
          - "admin:servers"
          - "read:users"
          - "tokens"
        services:
          - tostada

  singleuser:
    cloudMetadata:
      blockWithIptables: false
    networkPolicy:
      enabled: false
    storage:
      capacity: 256Mi

  proxy:
    chp:
      networkPolicy:
        enabled: false
      image:
        name: docker.io/rophy/configurable-http-proxy
        tag: "5.2.0-20260528-r1"
      extraCommandLineFlags:
        - "--no-include-prefix"
        - "--change-origin"
    service:
      type: NodePort

  prePuller:
    hook:
      enabled: false
    continuous:
      enabled: false

  scheduling:
    userScheduler:
      enabled: false
    userPlaceholder:
      enabled: false
