apiVersion: batch/v1
kind: Job
metadata:
  name: tostada-e2e
  namespace: tostada
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: tostada-e2e
        hub.jupyter.org/network-access-hub: "true"
        hub.jupyter.org/network-access-proxy-http: "true"
    spec:
      restartPolicy: Never
      containers:
        - name: e2e
          image: tostada-e2e:latest
          imagePullPolicy: Never
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          emptyDir: {}
