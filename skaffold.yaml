apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: tostada
build:
  artifacts:
    - image: tostada
      docker:
        dockerfile: Dockerfile
deploy:
  helm:
    releases:
      - name: jupyterhub
        remoteChart: jupyterhub
        repo: https://hub.jupyter.org/helm-chart/
        version: 4.1.0
        namespace: tostada
        createNamespace: true
        valuesFiles:
          - k8s/jupyterhub-values.yaml
  kubectl:
    manifests:
      - k8s/guacamole.yaml
      - k8s/tostada.yaml
