apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: tostada
build:
  artifacts:
    - image: tostada
      docker:
        dockerfile: Dockerfile
        buildArgs:
          DEVELOPMENT: "1"
deploy:
  helm:
    releases:
      - name: tostada
        chartPath: charts/tostada
        namespace: tostada
        createNamespace: true
        setValueTemplates:
          tostada.image: "{{.IMAGE_FULLY_QUALIFIED_tostada}}"
