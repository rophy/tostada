apiVersion: v1
kind: ConfigMap
metadata:
  name: tostada-config
  namespace: tostada
data:
  config.yaml: |
    server:
      addr: ":8080"
    oidc:
      issuerURL: "http://localhost:9090"
      clientID: "tostada"
      clientSecret: "tostada-secret"
      redirectURL: "http://localhost:8080/api/auth/callback"
    jupyterhub:
      apiURL: "http://hub.default.svc.cluster.local:8081/hub/api"
      apiToken: "changeme-tostada-api-token"
    guacamole:
      url: "http://guacamole:8080"
      jsonSecretKey: "8bea5deb816809f814b83c28cf14d3e2"
    workspaces:
      - name: jupyter
        displayName: Jupyter Notebook
        description: Python data science environment
        icon: notebook
        type: jupyterhub
        image: jupyter/minimal-notebook:latest
        port: 8888
        cmd: ["jupyterhub-singleuser"]
      - name: kasmvnc-ubuntu
        displayName: Ubuntu Desktop (KasmVNC)
        description: Full Ubuntu desktop in browser
        icon: desktop
        type: jupyterhub
        image: kasmweb/ubuntu-noble-desktop:1.16.1
        port: 6901
        cmd: ["/dockerstartup/kasm_default_profile.sh"]
      - name: xrdp-ubuntu
        displayName: Ubuntu Desktop (xRDP)
        description: Full Ubuntu desktop via RDP
        icon: desktop
        type: guacamole
        image: scottyhardy/docker-remote-desktop:latest
        port: 3389
        rdpCredentials:
          username: ubuntu
          password: ubuntu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tostada
  namespace: tostada
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tostada
  template:
    metadata:
      labels:
        app: tostada
    spec:
      containers:
        - name: tostada
          image: tostada
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/tostada
        - name: oidc-proxy
          image: alpine/socat:latest
          args: ["TCP-LISTEN:9090,fork,reuseaddr", "TCP:oidc-mock:8080"]
      volumes:
        - name: config
          configMap:
            name: tostada-config
---
apiVersion: v1
kind: Service
metadata:
  name: tostada
  namespace: tostada
spec:
  selector:
    app: tostada
  ports:
    - port: 8080
      targetPort: 8080
