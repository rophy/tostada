apiVersion: v1
kind: ConfigMap
metadata:
  name: tostada-config
  namespace: tostada
data:
  config.yaml: |
    server:
      addr: ":8080"
    oidc:
      issuerURL: "https://tostada.example.com/oidc"
      internalURL: "http://oidc-mock:8080"
      clientID: "tostada"
      clientSecret: "tostada-secret"
      redirectURL: "https://tostada.example.com/api/auth/callback"
    jupyterhub:
      apiURL: "http://hub:8081/hub/api"
      apiToken: "changeme-tostada-api-token"
      proxyURL: "http://proxy-public:80"
    guacamole:
      url: "http://guacamole:8080"
      jsonSecretKey: "8bea5deb816809f814b83c28cf14d3e2"
    workspaces:
      - name: jupyter
        displayName: Jupyter Notebook
        description: Python data science environment
        icon: notebook
        type: jupyterhub
        image: jupyter/minimal-notebook:latest
        port: 8888
        cmd: ["jupyterhub-singleuser"]
      - name: kasmvnc-ubuntu
        displayName: Ubuntu Desktop (KasmVNC)
        description: Full Ubuntu desktop in browser
        icon: desktop
        type: jupyterhub
        image: kasmweb/ubuntu-noble-desktop:1.19.0
        port: 6901
        cmd: ["/dockerstartup/kasm_default_profile.sh"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tostada
  namespace: tostada
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tostada
  template:
    metadata:
      labels:
        app: tostada
        hub.jupyter.org/network-access-hub: "true"
        hub.jupyter.org/network-access-singleuser: "true"
    spec:
      containers:
        - name: tostada
          image: tostada
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/tostada
        - name: oidc-proxy
          image: alpine/socat:latest
          args: ["TCP-LISTEN:9090,fork,reuseaddr", "TCP:oidc-mock:8080"]
      volumes:
        - name: config
          configMap:
            name: tostada-config
---
apiVersion: v1
kind: Service
metadata:
  name: tostada
  namespace: tostada
spec:
  selector:
    app: tostada
  ports:
    - port: 8080
      targetPort: 8080
