apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-mock
  namespace: tostada
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-mock
  template:
    metadata:
      labels:
        app: oidc-mock
    spec:
      containers:
        - name: oidc-mock
          image: ghcr.io/rophy/oidc-mock:latest
          ports:
            - containerPort: 8080
          env:
            - name: OIDC_CONFIG
              value: |
                issuer: http://localhost:9090
                clients:
                  - id: tostada
                    secret: tostada-secret
                    redirect_uris:
                      - http://localhost:8080/api/auth/callback
                users:
                  - sub: alice
                    email: alice@example.com
                    name: Alice Chen
                    preferred_username: alice
                  - sub: bob
                    email: bob@example.com
                    name: Bob Smith
                    preferred_username: bob
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-mock
  namespace: tostada
spec:
  selector:
    app: oidc-mock
  ports:
    - port: 8080
      targetPort: 8080
